<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI 聊天</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand-row">
          <div>
            <h1>AI 聊天</h1>
            <p>OpenAI-compatible API</p>
          </div>
          <button id="newChatBtn" class="icon-button" title="新建对话" aria-label="新建对话">
            <span>+</span>
          </button>
        </div>
        <div class="conversation-list" id="conversationList"></div>
      </aside>

      <main class="chat-panel">
        <header class="topbar">
          <div>
            <h2 id="conversationTitle">新对话</h2>
            <p id="statusText">本地 JSON 存储</p>
          </div>
          <div class="topbar-actions">
            <button id="importTwinBtn" class="secondary-button">导入画像</button>
            <button id="checkpointBtn" class="secondary-button">存档点</button>
            <button id="settingsBtn" class="secondary-button">设置</button>
          </div>
        </header>
        <section class="messages" id="messages"></section>
        <form class="composer" id="chatForm">
          <textarea id="messageInput" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
          <div class="composer-actions">
            <label class="inline-toggle" title="发送生成时插入历史上下文">
              <input id="inlinePrependContextInput" type="checkbox" />
              <span>上下文</span>
            </label>
            <label class="inline-k" title="插入上下文条数 k">
              <span>k</span>
              <input id="inlineContextKInput" type="number" min="1" max="400" step="1" value="40" />
            </label>
            <button id="historyBtn" type="button">History</button>
            <button id="sendBtn" type="submit">发送</button>
            <button id="generateBtn" type="button">生成</button>
          </div>
        </form>
      </main>
    </div>

    <dialog id="settingsDialog">
      <form method="dialog" class="settings-panel">
        <div class="dialog-header">
          <h3>API 设置</h3>
          <button class="icon-button" value="cancel" aria-label="关闭">✕</button>
        </div>
        <label>
          <span>Base URL</span>
          <input id="baseUrlInput" placeholder="https://api.openai.com/v1" />
        </label>
        <label>
          <span>API Key</span>
          <input id="apiKeyInput" type="password" autocomplete="off" placeholder="sk-..." />
        </label>
        <label>
          <span>Model</span>
          <input id="modelInput" placeholder="gpt-4.1-mini" />
        </label>
        <label>
          <span>System Prompt</span>
          <textarea id="systemPromptInput" rows="4" placeholder="可选"></textarea>
        </label>
        <label class="toggle-row">
          <span>聊天记录放到开头上下文</span>
          <input id="prependChatContextInput" type="checkbox" />
        </label>
        <label class="toggle-row">
          <span>末尾追加 user 提示词强调</span>
          <input id="appendTailUserPromptInput" type="checkbox" checked />
        </label>
        <label>
          <span>Temperature</span>
          <input id="temperatureInput" type="number" min="0" max="2" step="0.1" value="0.7" />
        </label>
        <label class="toggle-row">
          <span>思考模式</span>
          <input id="thinkingEnabledInput" type="checkbox" checked />
        </label>
        <label>
          <span>思考强度</span>
          <select id="reasoningEffortInput">
            <option value="high">high</option>
            <option value="max">max</option>
          </select>
        </label>
        <div class="dialog-actions">
          <button id="saveSettingsBtn" value="default">保存</button>
        </div>
      </form>
    </dialog>

    <dialog id="importDialog">
      <form method="dialog" class="settings-panel">
        <div class="dialog-header">
          <h3>导入画像</h3>
          <button class="icon-button" value="cancel" aria-label="关闭">✕</button>
        </div>
        <label>
          <span>导入模式</span>
          <select id="importModeInput">
            <option value="fetch">在线抓取</option>
            <option value="json">粘贴 JSON</option>
          </select>
        </label>
        <label>
          <span>Persona 名称（可选）</span>
          <input id="importPersonaInput" placeholder="例如：妈妈" />
        </label>
        <label>
          <span>目标说话人 sender（可选，默认 assistant）</span>
          <input id="importTargetSenderInput" placeholder="assistant" />
        </label>
        <label id="importJsonWrap">
          <span>粘贴 messages_export.json 内容</span>
          <textarea id="importJsonInput" rows="12" placeholder='[{"time":"2026-01-01 00:00:00","sender":"assistant","type":1,"content":"你好"}]'></textarea>
        </label>
        <div id="importFetchWrap">
          <label>
            <span>抓取 URL</span>
            <input id="importFetchUrlInput" placeholder="http://127.0.0.1:9527/api/msg/msgs" />
          </label>
          <label>
            <span>username</span>
            <input id="importFetchUsernameInput" placeholder="wxid_xxx" />
          </label>
          <label>
            <span>start_db</span>
            <input id="importFetchStartDbInput" placeholder="message_0.db" />
          </label>
          <label>
            <span>pages</span>
            <input id="importFetchPagesInput" type="number" min="1" max="200" step="1" value="10" />
          </label>
          <label>
            <span>size</span>
            <input id="importFetchSizeInput" type="number" min="1" max="500" step="1" value="100" />
          </label>
          <label>
            <span>Headers (JSON 对象)</span>
            <textarea id="importFetchHeadersInput" rows="6" placeholder='{"Authorization":"bearer xxx","Content-Type":"application/json;charset=UTF-8"}'></textarea>
          </label>
          <label>
            <span>Cookies (JSON 对象)</span>
            <textarea id="importFetchCookiesInput" rows="4" placeholder='{"traffic_info_access_token":"xxx"}'></textarea>
          </label>
          <label>
            <span>sender_map (JSON 对象)</span>
            <textarea id="importFetchSenderMapInput" rows="4" placeholder='{"wxid_a":"assistant","wxid_b":"user"}'></textarea>
          </label>
        </div>
        <label class="toggle-row">
          <span>用大模型总结画像</span>
          <input id="importLlmSummarizeInput" type="checkbox" />
        </label>
        <label>
          <span>LLM summary max chars</span>
          <input id="importLlmSummaryMaxCharsInput" type="number" min="60" max="5000" step="10" value="220" />
        </label>
        <label class="toggle-row">
          <span>聊天记录放到开头上下文</span>
          <input id="importPrependChatContextInput" type="checkbox" />
        </label>
        <div class="dialog-actions">
          <button id="submitImportBtn" value="default" type="button">开始导入</button>
        </div>
      </form>
    </dialog>

    <dialog id="historyDialog">
      <div class="history-panel">
        <div class="dialog-header">
          <h3>Imported History</h3>
          <button id="closeHistoryBtn" class="icon-button" type="button" aria-label="Close">✕</button>
        </div>
        <div class="history-toolbar">
          <button id="historyPrevBtn" class="secondary-button" type="button">Prev</button>
          <div id="historyMeta" class="history-meta">0 / 0</div>
          <button id="historyNextBtn" class="secondary-button" type="button">Next</button>
        </div>
        <section id="historyMessages" class="messages history-messages"></section>
      </div>
    </dialog>

    <script src="/static/app.js"></script>
  </body>
</html>
